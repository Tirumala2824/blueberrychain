version: 2

# =====================================================================
# BlueberryChain OS - Snowflake App Runtime manifest
#
# Deploys the Next.js chat UI as an APPLICATION SERVICE in
# BLUEBERRY_CHAIN.APP, running on BBC_WH.
#
# The app holds NO business logic. It is a thin conversational shell:
# it talks to the Supervisor Agent for reasoning and to Snowflake
# Postgres (via Prisma) for chat state. Every metric it displays is read
# from BLUEBERRY_CHAIN.SEMANTIC.ORGANIC_BLUEBERRY_CHAIN.
#
# Inside SPCS the container authenticates with the injected OAuth token
# at /snowflake/session/token, so no Snowflake password is needed here.
# =====================================================================

name: BLUEBERRYCHAIN_OS
database: BLUEBERRY_CHAIN
schema: APP
query_warehouse: BBC_WH

label: BlueberryChain OS
description: >-
  Autonomous chat-driven agriculture supply chain platform for the organic
  blueberry farm-to-retail cold chain. One conversation replaces PP, MM,
  LE/TM, QM, WM/EWM, SD and FI/CO.

environment_variables:
  - name: NODE_ENV
    value: production
  - name: SNOWFLAKE_ACCOUNT
    value: pndvhar-pt70809
  - name: SNOWFLAKE_WAREHOUSE
    value: BBC_WH
  - name: SNOWFLAKE_DATABASE
    value: BLUEBERRY_CHAIN
  - name: SNOWFLAKE_SCHEMA
    value: TOOLS
  - name: BBC_SUPERVISOR_AGENT
    value: BLUEBERRY_CHAIN.TOOLS.SUPERVISOR_AGENT

secrets:
  # Prisma connection string for app state. Held as a Snowflake SECRET so
  # it never appears in the manifest or the repo.
  - name: DATABASE_URL
    secret: BLUEBERRY_CHAIN.APP.BBC_DATABASE_URL

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - verify-prisma.cjs
  - check-prov.cjs
