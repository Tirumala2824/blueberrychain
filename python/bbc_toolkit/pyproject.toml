[project]
name = "bbc-toolkit"
version = "0.1.0"
description = "Shared contracts, validators, ledger hashing and agent-tool plumbing for BlueberryChain OS"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbc_toolkit"]
