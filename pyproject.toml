[project]
name = "blueberrychain-workspace"
version = "0.0.0"
description = "uv workspace root for BlueberryChain OS Python packages"
requires-python = ">=3.11"
dependencies = ["bbc-engine", "bbc-toolkit", "blueberrychain"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[tool.uv.sources]
bbc-engine = { workspace = true }
bbc-toolkit = { workspace = true }
blueberrychain = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "BLE", "TRY", "PLW", "RUF"]
ignore = ["TRY003"]  # descriptive messages at raise sites are intentional in CLI code
