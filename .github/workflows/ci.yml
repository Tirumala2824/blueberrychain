# Offline checks for every push and pull request: lint, types, unit and contract tests.
# Nothing here touches Snowflake - the SQL invariant suites (`bbc test sql`) run against
# the account, and the connector-sdk integration test skips without credentials.

name: CI

on:
  push:
    branches: [main, latest, dev, "rebuild/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (engine, toolkit, CLI, simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python from .python-version, locked dependencies)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check python
      - name: Format
        run: uv run ruff format --check python
      - name: Tests (golden worked example, determinism, contracts, scenarios, drift guards)
        run: uv run pytest
      - name: Policy v1 is valid
        run: uv run bbc policy check snowflake/seed/policy/v3.json

  node:
    name: TypeScript (contracts, connectors, mocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
      - name: Tests (incl. generated-types drift)
        run: pnpm -r test

  e2e:
    name: Control tower UI (Playwright, fixture mode)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Browser
        run: pnpm --filter @blueberrychain/control-tower exec playwright install --with-deps chromium
      - name: End-to-end (recorded tapes; nothing reaches Snowflake)
        run: pnpm --filter @blueberrychain/control-tower e2e
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/control-tower/playwright-report
          retention-days: 7
